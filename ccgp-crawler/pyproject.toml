[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccgp-crawler"
version = "0.1.0"
description = "Low-frequency static-list crawler for CCGP notices"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "playwright>=1.55,<2",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ccgp-crawler = "ccgp_crawler.cli:main"
ccgp-console = "ccgp_crawler.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
